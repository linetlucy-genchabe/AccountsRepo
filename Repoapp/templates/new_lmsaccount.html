{% extends 'base.html' %}
{% load bootstrap5 %}

{% block content %}

<div class="page-header">
  <div class="container">
    <a href="{% url 'lmsaccounts' %}" style="color:rgba(255,255,255,0.6); margin-bottom:12px; display:inline-flex; align-items:center; gap:6px; font-size:13px; text-decoration:none;">
      ← Back to LMS Accounts
    </a>
    <h1>New LMS Account</h1>
    <p>Create a new LMS user record</p>
  </div>
</div>

<div class="container py-4">
  <div class="form-card">
    <div style="margin-bottom:28px; padding-bottom:18px; border-bottom:1px solid var(--gray-100);">
      <h2 style="font-size:18px; margin-bottom:3px;">LMS Account Details</h2>
      <p style="font-size:13px; color:var(--gray-600);">Fill in the fields below to register a new LMS account</p>
    </div>

    <form action="{% url 'new-lmsaccount' %}" method="post" enctype="multipart/form-data">
      {% csrf_token %}
      {% bootstrap_form form5 %}
      <div class="d-flex gap-3 mt-4">
        <button type="submit" class="btn-navy">
          <i class="fas fa-save" style="font-size:12px;"></i> Save Account
        </button>
        <a href="{% url 'lmsaccounts' %}" class="btn-outline-navy">Cancel</a>
      </div>
    </form>
  </div>
</div>

{% endblock %}
