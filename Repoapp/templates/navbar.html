{% load static %}
<nav class="navbar navbar-expand-lg sticky-top">
  <div class="container-fluid px-4">

    <!-- Brand -->
    <a class="navbar-brand" href="{% url 'index' %}">
      Accounts Repository
    </a>

    <!-- Toggler -->
    <button class="navbar-toggler border-0" type="button" data-bs-toggle="collapse" data-bs-target="#mainNav"
      aria-controls="mainNav" aria-expanded="false" aria-label="Toggle navigation">
      <i class="fas fa-bars" style="color: var(--navy);"></i>
    </button>

    <div class="collapse navbar-collapse" id="mainNav">

      <!-- Left nav -->
      <ul class="navbar-nav me-auto align-items-lg-center gap-1">

        {% if user.is_authenticated %}
        <!-- Accounts dropdown -->
        <li class="nav-item dropdown">
          <a class="nav-link dropdown-toggle d-flex align-items-center gap-2" href="#"
            id="accountsDropdown" role="button" data-bs-toggle="dropdown" aria-expanded="false">
            <i class="fas fa-database" style="font-size:12px; color:var(--gray-400);"></i> Accounts
          </a>
          <ul class="dropdown-menu" aria-labelledby="accountsDropdown">
            <li>
              <a class="dropdown-item d-flex align-items-center gap-2" href="{% url 'index' %}">
                <i class="fas fa-heartbeat" style="font-size:12px; color:var(--gray-400);"></i> eCHIS
              </a>
            </li>
            <li>
              <a class="dropdown-item d-flex align-items-center gap-2" href="{% url 'dashboards' %}">
                <i class="fas fa-chart-bar" style="font-size:12px; color:var(--gray-400);"></i> Dashboards
              </a>
            </li>
            <li>
              <a class="dropdown-item d-flex align-items-center gap-2" href="{% url 'lmsaccounts' %}">
                <i class="fas fa-graduation-cap" style="font-size:12px; color:var(--gray-400);"></i> LMS
              </a>
            </li>
          </ul>
        </li>
        {% endif %}

      </ul>

      <!-- Right side -->
      <div class="d-flex align-items-center gap-3">

        {% if user.is_authenticated %}
        <!-- Search -->
        <form action="{% url 'search_results' %}" class="d-none d-lg-flex">
          <input class="form-control" type="text" placeholder="Search accounts…" name="keyword" autocomplete="off">
        </form>

        <!-- User dropdown -->
        <div class="dropdown">
          <a class="nav-link dropdown-toggle d-flex align-items-center gap-2" href="#"
            id="userDropdown" role="button" data-bs-toggle="dropdown" aria-expanded="false"
            style="font-size:14px; font-weight:500; color:var(--navy);">
            <span style="
              width:32px; height:32px; border-radius:50%;
              background:var(--navy); color:var(--gold);
              display:inline-flex; align-items:center; justify-content:center;
              font-size:13px; font-weight:700; font-family:'Fraunces',serif;
            ">{{ user.username|first|upper }}</span>
            {{ user.username }}
          </a>
          <ul class="dropdown-menu dropdown-menu-end" aria-labelledby="userDropdown">
            <li>
              <a class="dropdown-item d-flex align-items-center gap-2" href="{% url 'profile' %}">
                <i class="fas fa-user" style="font-size:12px; color:var(--gray-400);"></i> Profile
              </a>
            </li>
            <li><hr class="dropdown-divider my-1" style="border-color:var(--gray-100);"></li>
            <li>
              <a class="dropdown-item d-flex align-items-center gap-2" href="/logout"
                style="color:var(--danger);">
                <i class="fas fa-sign-out-alt" style="font-size:12px;"></i> Logout
              </a>
            </li>
          </ul>
        </div>

        {% else %}
        <a href="/login" class="btn-login nav-link">Sign In</a>
        {% endif %}

      </div>
    </div>
  </div>
</nav>
